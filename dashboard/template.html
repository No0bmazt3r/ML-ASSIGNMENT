<style>
/* Layout: a meter-panel presenter. Fixed header rail (CRISP-DM phases), one step per screen
   (copy left, instrument-style charts right), fixed footer controls. Steps stack on phones. */
:root {
  --bg: #f2f4f6; --surface: #fcfdfd; --ink: #0e1620; --ink2: #46525f; --muted: #6f7a86;
  --grid: #e2e6ea; --axis: #c3cad2; --hair: rgba(14,22,32,.10); --wash: rgba(14,22,32,.04);
  --ac: #2a78d6; --ac-wash: rgba(42,120,214,.12); --light: #eb6834; --pv: #1baf7a; --other: #c3c8ce;
  --m0: #6250d6; --m1: #eda100; --bad: #d03b3b; --bad-text: #b3261e; --good-text: #006300;
  --on-fill: #ffffff;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1014; --surface: #151a20; --ink: #eef1f4; --ink2: #b9c1ca; --muted: #8f99a3;
  --grid: #252b32; --axis: #3a434d; --hair: rgba(255,255,255,.10); --wash: rgba(255,255,255,.04);
  --ac: #3987e5; --ac-wash: rgba(57,135,229,.18); --light: #d95926; --pv: #199e70; --other: #4b545e;
  --m0: #9085e9; --m1: #c98500; --bad: #e66767; --bad-text: #ff8a85; --good-text: #3ccf3c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1014; --surface: #151a20; --ink: #eef1f4; --ink2: #b9c1ca; --muted: #8f99a3;
  --grid: #252b32; --axis: #3a434d; --hair: rgba(255,255,255,.10); --wash: rgba(255,255,255,.04);
  --ac: #3987e5; --ac-wash: rgba(57,135,229,.18); --light: #d95926; --pv: #199e70; --other: #4b545e;
  --m0: #9085e9; --m1: #c98500; --bad: #e66767; --bad-text: #ff8a85; --good-text: #3ccf3c; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 4px; }

/* header rail */
header { background: var(--surface); border-bottom: 1px solid var(--hair); padding-block: 10px; display: flex; gap: 20px; align-items: center; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: none; }
.brand b { font: 600 15px/1.2 var(--display); letter-spacing: .01em; }
.brand span { font: 12px/1.3 var(--mono); color: var(--muted); }
.rail { flex: 1; display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; min-width: 0; }
.rail button { border: 0; background: none; padding: 0 0 2px; cursor: pointer; text-align: left; min-height: 34px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.rail .ph { font: 500 10.5px/1.15 var(--mono); color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .bar { height: 4px; border-radius: 2px; background: var(--grid); transition: background .25s var(--ease); }
.rail button[aria-current="step"] .bar { background: var(--ac); }
.rail button.done .bar { background: var(--axis); }
.rail button[aria-current="step"] .ph { color: var(--ink); }
.rail button.cont .ph { visibility: hidden; }
.compact { display: none; font: 12px/1.3 var(--mono); color: var(--ink2); }

/* stage */
main { overflow: auto; min-height: 0; }
.step { min-height: 100%; padding-block: 28px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); gap: 32px; align-items: start; max-width: 1440px; margin: 0 auto; box-sizing: border-box; align-content: start; }
.step.wide { grid-template-columns: minmax(0, 1fr); }
.copy { display: grid; gap: 14px; min-width: 0; align-content: start; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 500 12px/1.3 var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.chip { font: 500 11px/1 var(--mono); letter-spacing: .03em; text-transform: none; padding: 5px 8px; border-radius: 999px; border: 1px solid var(--hair); color: var(--ink2); background: var(--surface); }
h1, h2 { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(40px, 6vw, 76px); line-height: 1; }
h2 { font-size: clamp(26px, 3vw, 38px); line-height: 1.08; }
.lede { font-size: 17px; color: var(--ink2); margin: 0; max-width: 60ch; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 62ch; }
.points li { padding-left: 18px; position: relative; color: var(--ink2); }
.points li::before { content: ""; position: absolute; left: 0; top: .62em; width: 8px; height: 2px; background: var(--axis); }
.points b { color: var(--ink); font-weight: 600; }
.num { font-family: var(--mono); font-size: .93em; color: var(--ink); }
.viz { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 14px 16px 12px; min-width: 0; display: grid; gap: 8px; align-content: start; }
.panel h3 { margin: 0; font: 600 14px/1.3 var(--body); }
.panel .sub { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); }
.chart { min-width: 0; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.sq { width: 10px; height: 10px; border-radius: 2px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fact { display: grid; gap: 2px; }
.fact b { font: 600 28px/1.05 var(--display); }
.fact span { font-size: 12.5px; color: var(--muted); }
.fix { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--hair); }
.fix:first-child { border-top: 0; }
.fix .n { font: 500 12px/1 var(--mono); color: var(--muted); }
.fix b { font-weight: 600; }
.fix p { grid-column: 2; margin: 0; color: var(--ink2); font-size: 14px; }
code { font: 13px/1.3 var(--mono); background: var(--wash); border: 1px solid var(--hair); padding: 1px 5px; border-radius: 4px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: grid; gap: 4px; align-content: start; }
.card b { font-weight: 600; }
.card p { margin: 0; color: var(--ink2); font-size: 14px; }
.card .affects { font: 12px/1.35 var(--mono); color: var(--muted); }
.flag { display: inline-flex; gap: 6px; align-items: center; font: 500 12px/1 var(--mono); color: var(--bad-text); }
.flag svg { flex: none; }

/* dashboard */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; border: 1px dashed var(--axis); color: var(--ink2); font-size: 13.5px; background: var(--surface); }
.controls { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: end; }
.seg { display: grid; gap: 6px; }
.seg > span { font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.seg div { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-left: 1px solid var(--axis); background: var(--surface); padding: 0 14px; min-height: 40px; min-width: 64px; cursor: pointer; font: 500 14px/1 var(--mono); transition: background .15s var(--ease), color .15s var(--ease); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--wash); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .label { font-size: 13px; color: var(--ink2); }
.kpi .value { font: 600 40px/1.05 var(--display); letter-spacing: -.01em; }
.kpi .value small { font: 500 16px/1 var(--body); color: var(--ink2); margin-left: 4px; }
.kpi .note { font-size: 12.5px; color: var(--muted); }
.kpi .value.flash { animation: flash .5s var(--ease); }
.dash-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.recs { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: rec; }
.recs li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; color: var(--ink2); font-size: 14px; counter-increment: rec; }
.recs li::before { content: counter(rec); font: 600 12px/22px var(--mono); text-align: center; width: 22px; height: 22px; border-radius: 50%; background: var(--wash); border: 1px solid var(--hair); color: var(--ink); }
.recs b { color: var(--ink); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--ink2); }
.kv dd { margin: 0; font: 500 13px/1.5 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* footer */
footer { background: var(--surface); border-top: 1px solid var(--hair); padding-block: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; }
.navbtn { min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; transition: background .15s var(--ease); }
.navbtn:hover { background: var(--wash); }
.navbtn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.navbtn:disabled { opacity: .4; cursor: default; }
.counter { font: 500 13px/1 var(--mono); color: var(--ink2); }
.keys { margin-left: auto; font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
kbd { font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px; border: 1px solid var(--axis); background: var(--bg); color: var(--ink2); }
.notes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); color: var(--surface); padding-block: 14px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); font-size: 15px; box-shadow: 0 -8px 24px rgba(0,0,0,.18); }
.notes .in { max-width: 980px; margin: 0 auto; display: grid; gap: 6px; }
.notes b { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.notes p { margin: 0; }

/* tooltip */
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--surface); font: 12.5px/1.4 var(--body); padding: 7px 9px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.tip .t { font: 500 11px/1.3 var(--mono); opacity: .75; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* SVG text + marks */
.chart text { fill: var(--ink2); font: 11.5px var(--body); }
.chart text.m { fill: var(--muted); font: 11px var(--mono); }
.chart text.v { fill: var(--ink); font: 600 12px var(--mono); }
.chart text.in { fill: var(--on-fill); font: 600 12px var(--mono); }
.chart text.big { fill: var(--ink); font: 600 15px var(--display); }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .ax { stroke: var(--axis); stroke-width: 1; }
.chart [data-tip] { cursor: default; }

/* motion: elements rest in their final state; .play adds the entry animation */
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes gx { from { transform: scaleX(0); } }
@keyframes gy { from { transform: scaleY(0); } }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { 0% { opacity: 0; transform: scale(1.8) rotate(-14deg); } 60% { opacity: 1; } }
@keyframes flash { from { color: var(--ac); } }
.a-draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
.a-gx { transform-box: fill-box; transform-origin: left center; }
.a-gy { transform-box: fill-box; transform-origin: center bottom; }
.a-pop { transform-box: fill-box; transform-origin: center; }
.play .copy > * { animation: fade .5s var(--ease) both; animation-delay: calc(var(--k, 0) * 70ms); }
.play .a-draw { animation: draw var(--dur, 1600ms) var(--ease) both; animation-delay: calc(var(--d, 0) * 1ms); }
.play .a-gx { animation: gx 700ms var(--ease) both; animation-delay: calc(var(--d, 0) * 1ms); }
.play .a-gy { animation: gy 700ms var(--ease) both; animation-delay: calc(var(--d, 0) * 1ms); }
.play .a-fade { animation: fadein 500ms var(--ease) both; animation-delay: calc(var(--d, 0) * 1ms); }
.play .a-pop { animation: pop 520ms var(--ease) both; animation-delay: calc(var(--d, 0) * 1ms); }
@media (prefers-reduced-motion: reduce) { .play *, .kpi .value.flash { animation: none !important; } }

/* narrow screens */
@media (max-width: 980px) {
  .step { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 20px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  header { flex-wrap: wrap; gap: 6px 12px; }
  .rail { flex-basis: 100%; grid-template-columns: repeat(11, 1fr); }
  .rail .ph { display: none; }
  .rail button { min-height: 16px; }
  .compact { display: block; margin-left: auto; }
  .row2, .cards { grid-template-columns: minmax(0, 1fr); }
  .keys { display: none; }
  .counter { margin-left: auto; }
  .kpi .value { font-size: 32px; }
}
</style>

<script>const D=/*__DATA__*/null;</script>
<script>
(() => {
"use strict";
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 0) => fmt(v, d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lin = (d0, d1, r0, r1) => v => r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0);
function ticks(max, n = 4) {
  const raw = max / n, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(6)); return out;
}
const niceMax = (max, n = 4) => { const t = ticks(max, n); return t[t.length - 1] < max ? t[t.length - 1] + (t[1] - t[0]) : t[t.length - 1]; };
const tip = $("#tip");
const showTip = (html, x, y) => { tip.innerHTML = html; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x + 14)) + "px"; tip.style.top = Math.max(8, y - h - 12) + "px"; };
const hideTip = () => { tip.hidden = true; };
document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointermove", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointerout", e => { if (e.target.closest("[data-tip]")) hideTip(); });
const tipAttr = html => `data-tip="${esc(html)}"`;
const dot = c => `<i style="background:var(${c})"></i>`;

const E = D.evaluate, M = D.method, S = D.scenarios, X = D.data, MO = D.modes;
const acTest = E.metrics.ac, lgTest = E.metrics.light;
const frozenAc = acTest.find(m => m.frozen), tod = acTest.find(m => m.model === "time_of_day"), ridge = acTest.find(m => m.model === "ridge");
const GROUP = { power: "Power", harmonics: "Harmonics", power_quality: "Power quality", temporal: "Temporal (lags)", calendar: "Calendar" };
const FEATURE = f => f.replace(/^agg_/, "").replace(/_/g, " ").replace(/Real Power(\d)/, "Real power, phase $1").replace(/Apparent Power(\d)/, "Apparent power, phase $1")
  .replace(/Current(\d)H(\d+)/, "Phase $1 current, harmonic $2").replace(/ratio (\d)H(\d+)/, "Harmonic $2 / fundamental, phase $1").replace(/THD(\d)/, "THD, phase $1").replace("hour sin", "Hour of day (sin)");
const t0 = new Date(E.series.t0);
const tAt = i => new Date(t0.getTime() + i * 15 * 60000);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const tLabel = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const sh = S.peak_shaving, ah = S.after_hours, pd = S.peak_drivers_week6_pct, sp = S.solar_and_precooling;

// ---------- chart builders (return SVG strings sized to the container width) ----------
function linePath(xs, ys, x, y) {
  let d = "", prev = null;
  xs.forEach((xi, i) => { const v = ys[i]; if (v == null) { prev = null; return; }
    d += (prev == null || xi - prev > 1 ? "M" : "L") + x(xi).toFixed(1) + "," + y(v).toFixed(1); prev = xi; });
  return d;
}
function dayTicks(xs, x, H, top) {
  let s = "";
  const R = x(xs[xs.length - 1]);
  xs.forEach(i => { const d = tAt(i); if (d.getHours() === 0 && d.getMinutes() === 0) {
    s += `<line class="gl" x1="${x(i)}" x2="${x(i)}" y1="${top}" y2="${H}"/>` + (R - x(i) > 44 ? `<text class="m" x="${x(i) + 4}" y="${H + 14}">${DOW[d.getDay()]} ${d.getDate()}</text>` : ""); } });
  return s;
}
function yAxis(tk, y, L, R) {
  return tk.map(v => `<line class="gl" x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}"/><text class="m" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("");
}

const charts = {
  // step 0: the test week's building load drawing itself
  hero(w) {
    const H = Math.round(Math.min(340, Math.max(220, w * .42))), L = 34, R = w - 8, T = 18, B = H - 22;
    const xs = E.series.t, mx = niceMax(Math.max(...E.series.building) * 1.08);
    const x = lin(xs[0], xs[xs.length - 1], L, R), y = lin(0, mx, B, T);
    const pi = E.series.building.indexOf(Math.max(...E.series.building));

    const cw = (R - L) / rows.length, bw = Math.min(56, cw * .5);
    let s = yAxis(ticks(mx, 3), y, L, R) + `<text class="m" x="${L}" y="${T - 14}">kW off the period's maximum demand</text>`;
    rows.forEach((r, i) => {
      const cx = L + cw * i + cw / 2;
      s += `<rect class="a-gy" style="--d:${300 + i * 200}" x="${cx - bw / 2}" y="${y(r.max_demand_cut_kw)}" width="${bw}" height="${B - y(r.max_demand_cut_kw)}" rx="4" fill="var(--ac)" ${tipAttr(`<b>Trim A/C ${r.trim_pct}%</b> when demand ≥ ${fmt(sh.trigger_kw, 1)} kW<br>Cut ${fmt(r.max_demand_cut_kw, 1)} kW (model) · ${fmt(r.week6_cut_kw_measured, 1)} kW using the real sub-meter, week 6<br>RM ${fmt(r.rm_per_year[0])}–${fmt(r.rm_per_year[1])} per year`)}/>
        <line class="a-fade" style="--d:${900 + i * 200}" x1="${cx - bw / 2 - 6}" x2="${cx + bw / 2 + 6}" y1="${y(r.week6_cut_kw_measured)}" y2="${y(r.week6_cut_kw_measured)}" stroke="var(--ink)" stroke-width="2"/>
        <text class="v a-fade" style="--d:${800 + i * 200}" x="${cx}" y="${y(Math.max(r.max_demand_cut_kw, r.week6_cut_kw_measured)) - 8}" text-anchor="middle">${fmt(r.max_demand_cut_kw, 1)} kW</text>
        <text x="${cx}" y="${B + 16}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${r.trim_pct}% trim</text>
        <text class="m" x="${cx}" y="${B + 32}" text-anchor="middle">RM ${fmt(r.rm_per_year[0] / 1000, 1)}k–${fmt(r.rm_per_year[1] / 1000, 1)}k/yr</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${H}" role="img" aria-label="Maximum-demand cut for 10, 20 and 30 percent A/C trim">${s}</svg>`;
  },
  // step 8: pre-cooling windows (negative = peak went up)
  precool(w) {
    const rows = sp.windows, L = 70, R = w - 8, rh = 28, H = rows.length * rh + 30;
    const lo = Math.min(...rows.map(r => r.max_demand_cut_kw)), mx = Math.max(1, ...rows.map(r => r.max_demand_cut_kw));
    const x = lin(Math.floor(lo) - 1, mx, L, R), z = x(0);
    let s = `<line class="ax" x1="${z}" x2="${z}" y1="0" y2="${rows.length * rh}"/><text class="m" x="${z}" y="${H - 8}" text-anchor="end">no change</text>
      <text class="m" x="${L}" y="${H - 8}">← peak goes up</text>`;
    rows.forEach((r, i) => {
      const y0 = i * rh + 4, v = r.max_demand_cut_kw;
      s += `<text x="0" y="${y0 + 14}">${r.window}h</text>`;
      if (v < 0) s += `<rect class="a-gx" style="--d:${300 + i * 160};transform-origin:right center" x="${x(v)}" y="${y0}" width="${z - x(v)}" height="18" rx="4" fill="var(--bad)" ${tipAttr(`Moving ${sp.precool_shift_pct}% of 14–16h A/C into <b>${r.window}h</b><br>raises the period's maximum by ${fmt(-v, 1)} kW (${fmt(-r.week6_max_cut_kw_measured_ac, 1)} kW with the real sub-meter)`)}/>
        <text class="v a-fade" style="--d:${800 + i * 160}" x="${x(v) - 6}" y="${y0 + 13}" text-anchor="end">+${fmt(-v, 1)} kW</text>`;
      else s += `<circle cx="${z}" cy="${y0 + 9}" r="4" fill="var(--ink2)" ${tipAttr(`<b>${r.window}h</b>: no change to the period's maximum`)}/><text class="m" x="${z - 10}" y="${y0 + 13}" text-anchor="end">0 kW · sun at ${fmt(r.pv_irradiance_vs_peak_pct)}% of its peak</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${H}" role="img" aria-label="Effect of fixed pre-cooling windows on maximum demand">${s}</svg>`;
  },
  // step 9: CRISP-ML(Q) loop
  loop(w) {
    const ph = ["Business & data understanding", "Data preparation", "Modeling", "Evaluation", "Deployment", "Monitoring & maintenance"];
    const H = Math.min(340, Math.max(260, w * .55)), cx = w / 2, cy = H / 2, rx = Math.min(w * .26, 200), ry = H * .36;
    const pos = ph.map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / ph.length; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
    let s = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" pathLength="1" class="a-draw" style="--dur:2000ms" fill="none" stroke="var(--axis)" stroke-width="2"/>`;
    pos.forEach(([x, y], i) => {
      const last = i === ph.length - 1, words = ph[i].split(" "), half = Math.ceil(words.length / 2);
      const lines = words.length > 2 ? [words.slice(0, half).join(" "), words.slice(half).join(" ")] : [ph[i]];
      const side = Math.abs(x - cx) < 4 ? 0 : x > cx ? 1 : -1, anchor = side ? (side > 0 ? "start" : "end") : "middle";
      const y0 = side ? y - (lines.length - 1) * 7 + 4 : y < cy ? y - 14 - (lines.length - 1) * 14 : y + 24;
      const st = `--d:${300 + i * 300};${last ? "font-weight:600;fill:var(--ink)" : ""}`;
      s += `<g class="a-pop" style="--d:${200 + i * 300}"><circle cx="${x}" cy="${y}" r="7" fill="${last ? "var(--ac)" : "var(--ink)"}" stroke="var(--surface)" stroke-width="2"/></g>`
        + lines.map((ln, k) => `<text class="a-fade" style="${st}" x="${x + side * 14}" y="${y0 + k * 14}" text-anchor="${anchor}">${ln}</text>`).join("");
    });
    s += `<text class="m a-fade" style="--d:2000" x="${cx}" y="${cy + 4}" text-anchor="middle">re-check against a short sub-meter campaign</text>`;
    return `<svg viewBox="0 0 ${w} ${H}" role="img" aria-label="CRISP-ML(Q) cycle ending in monitoring and maintenance">${s}</svg>`;
  },
};

    <div class="viz"><div class="panel"><h3>Demand-triggered A/C trim</h3><p class="sub">Blue: cut from main-meter estimates (unseen weeks). Black tick: the same rule with the real sub-meter, week ${M.test_week}.</p><div class="chart" data-chart="trim"></div></div>
      <div class="panel"><h3>Fixed pre-cooling: change in maximum demand</h3><p class="sub">${sp.precool_shift_pct}% of 14:00–16:00 A/C moved into each window. <span class="flag"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11 10H1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 4.5v2.5M6 8.6v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>raises the peak</span></p><div class="chart" data-chart="precool"></div></div></div>`,
    notes: `This is where the marks are: insight over accuracy. The model's estimate drives a simple controller, cut A/C a little only when the building nears its peak, and the saving computed from our estimate matches the real sub-meter. And we changed our own recommendation: the pre-cooling idea from the proposal made the peak worse, so we say so.` },

  { phase: "Monitoring & maintenance", section: "08 Conclude with limits", title: "Limits", render: () => `
    <div class="copy">
      <div class="eyebrow">08 · Conclude with limits <span class="chip">CRISP-ML(Q) · Monitoring &amp; maintenance</span></div>
      <h2>What these results can and can't support.</h2>
      <div class="cards">
        <div class="card"><b>One building, one season</b><p>About three weeks of A/C ground truth and one test week, so confidence intervals are wide.</p><span class="affects">affects: every kW and RM figure</span></div>
        <div class="card"><b>Different cooling system</b><p>The CLEMD building uses rooftop VRF units. UTP is largely on district cooling. The method transfers; this trained model does not.</p><span class="affects">affects: rollout to UTP</span></div>
        <div class="card"><b>Lighting estimate unreliable</b><p>After-hours lighting savings use the measured sub-meter, not a main-meter estimate.</p><span class="affects">affects: after-hours kWh and tCO₂e</span></div>
        <div class="card"><b>Scenario inputs</b><p>TNB rates from secondary sources, provisional grid factor ${fmt(S.assumptions.gef_t_per_mwh, 3)} t/MWh, annualised from ${S.assumptions.annualised_from}.</p><span class="affects">affects: RM and tCO₂e per year</span></div>
      </div>
      <ul class="points"><li><b>Next:</b> a two-week sub-meter campaign per new building to retrain and validate, monthly drift checks, weather inputs, and a 15-minute-ahead forecast so the trim can act before the peak.</li></ul>
    </div>
    <div class="viz"><div class="panel"><h3>CRISP-ML(Q): the loop does not end at deployment</h3><p class="sub">Models drift when buildings, seasons or tariffs change.</p><div class="chart" data-chart="loop"></div></div></div>`,
    notes: `Close the technical story honestly. This is one building and one season. The trained model will not transfer to UTP's district-cooled buildings, but the method will, with a short sub-meter campaign per building. CRISP-ML(Q) adds the monitoring phase for exactly this reason.` },

  { phase: "Deployment", section: "Stakeholder dashboard", title: "Dashboard", wide: true, render: () => `
    <div class="copy">
      <div class="eyebrow">For UTP facilities &amp; energy management <span class="chip">Main meter only</span></div>
      <h2>What one building's main meter can tell you.</h2>
      <div class="banner"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7v4M8 4.8v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Scenario for one CLEMD-sized office building, not a UTP measurement. Built from main-meter estimates on ${S.basis.match(/\((\d+) days\)/)?.[1] ?? "20"} unseen days, annualised from ${S.assumptions.annualised_from}.</span></div>
      <div class="controls">
        <div class="seg"><span id="lblTrim">A/C trim at high demand</span><div role="group" aria-labelledby="lblTrim">${sh.scenarios.map(s => `<button id="trim${s.trim_pct}" data-trim="${s.trim_pct}" aria-pressed="${s.trim_pct === state.trim}">${s.trim_pct}%</button>`).join("")}</div></div>
        <div class="seg"><span id="lblHours">Office hours</span><div role="group" aria-labelledby="lblHours">${ah.scenarios.map(s => `<button id="hours${s.office_hours}" data-hours="${s.office_hours}" aria-pressed="${s.office_hours === state.hours}">${s.office_hours.replace("-", "–")}</button>`).join("")}</div></div>
      </div>
    </div>
    <div class="viz" id="dash"></div>`,
    notes: `Hand the dashboard to the stakeholder. Use the two selectors live: show the 10, 20 and 30% trim options, then switch the office-hours definition to show the savings hold up. Point at the banner every time someone quotes a number. Finish on the four recommendations.` },
];

function dashBody() {
  const { t, a } = dashNumbers();
  return `<div class="kpis">
      <div class="kpi"><span class="label">A/C share of peak demand</span><span class="value">${pct(pd.ac_estimated)}</span><span class="note">estimated · ${pct(pd.ac_measured, 1)} measured, test week</span></div>
      <div class="kpi"><span class="label">Peak cut at ${t.trim_pct}% trim</span><span class="value flash">${fmt(t.max_demand_cut_kw, 1)}<small>kW</small></span><span class="note">trigger ${fmt(sh.trigger_kw, 1)} kW · max ${fmt(sh.base_max_15min_kw, 1)} kW</span></div>
      <div class="kpi"><span class="label">Demand-charge saving</span><span class="value flash">RM ${fmt(t.rm_per_year[0] / 1000, 1)}k–${fmt(t.rm_per_year[1] / 1000, 1)}k</span><span class="note">per year · RM ${fmt(t.rm_per_month[0])}–${fmt(t.rm_per_month[1])} per month</span></div>
      <div class="kpi"><span class="label">After-hours savings (${a.office_hours.replace("-", "–")} office day)</span><span class="value flash">${fmt(a.saved_tco2e_per_year, 1)}<small>tCO₂e/yr</small></span><span class="note">${fmt(a.saved_kwh_per_year)} kWh/yr · ${fmt(a.pct_of_utp_scope2, 3)}% of UTP Scope 2</span></div>
    </div>
    <div class="dash-grid">
      <div class="panel"><h3>Who sets the peak?</h3><p class="sub">Top 5% demand windows, test week</p><div class="chart" data-chart="shares" data-rows="drivers"></div>
        <div class="legend"><span><i class="sq" style="background:var(--ac)"></i>A/C</span><span><i class="sq" style="background:var(--light)"></i>Lighting</span><span><i class="sq" style="background:var(--other)"></i>Other</span></div></div>
      <div class="panel"><h3>Can you trust the estimate?</h3>
        <dl class="kv"><dt>Typical A/C error, test week</dt><dd>${fmt(frozenAc.mae, 2)} kW</dd><dt>95% interval</dt><dd>${fmt(frozenAc.lo, 2)}–${fmt(frozenAc.hi, 2)} kW</dd><dt>Average A/C load</dt><dd>${fmt(E.ac_mean_kw, 1)} kW</dd><dt>Error in peak windows</dt><dd>${fmt(frozenAc.peak_mae, 2)} kW</dd><dt>Peak cut: model vs sub-meter (${t.trim_pct}%)</dt><dd>${fmt(t.week6_cut_kw_estimated, 1)} vs ${fmt(t.week6_cut_kw_measured, 1)} kW</dd><dt>A/C after hours/day: model vs sub-meter</dt><dd>${fmt(a.week6_ac_after_kwh_day_estimated, 1)} vs ${fmt(a.week6_ac_after_kwh_day_measured, 1)} kWh</dd></dl>
        <p class="sub" style="margin:0">The model over-estimates after-hours A/C, so after-hours savings lean optimistic.</p></div>
      <div class="panel"><h3>After-hours energy (${a.office_hours.replace("-", "–")} office day)</h3>
        <dl class="kv"><dt>A/C outside office hours (estimated)</dt><dd>${fmt(a.ac_after_kwh_day_estimated, 1)} kWh/day</dd><dt>Lighting &amp; sockets (sub-meter)</dt><dd>${fmt(a.light_after_kwh_day, 1)} kWh/day</dd><dt>Assumed cuts</dt><dd>A/C ${Math.round(ah.cuts.ac * 100)}% · lighting ${Math.round(ah.cuts.light * 100)}%</dd><dt>Saved per year</dt><dd>${fmt(a.saved_kwh_per_year)} kWh</dd><dt>Grid factor</dt><dd>${fmt(S.assumptions.gef_t_per_mwh, 3)} t/MWh</dd></dl></div>
    </div>
    <div class="dash-grid">
      <div class="panel" style="grid-column: span 2"><h3>Recommendations</h3><ol class="recs">
        <li><span><b>Add a demand-triggered A/C trim</b> at about ${fmt(sh.trigger_kw)} kW, starting at 10–20%. It cuts ${fmt(sh.scenarios[0].max_demand_cut_kw, 1)}–${fmt(sh.scenarios[1].max_demand_cut_kw, 1)} kW off the monthly maximum with little comfort impact.</span></li>
        <li><span><b>Schedule A/C and lighting off after hours and on non-working days.</b> Non-working days still use ${fmt(MO.summary[1].ac_after_kwh_day_measured)} kWh of A/C and ${fmt(MO.summary[1].light_after_kwh_day)} kWh of lighting each.</span></li>
        <li><span><b>Don't adopt fixed-time pre-cooling.</b> On this building it raised the peak by ${fmt(-Math.min(...sp.windows.map(w => w.max_demand_cut_kw)), 1)} kW.</span></li>
        <li><span><b>Before rollout, sub-meter each new building for two weeks</b> to retrain and validate, then check monthly for drift.</span></li></ol></div>
      <div class="panel"><h3>Operating modes</h3><dl class="kv"><dt>Working days</dt><dd>${MO.summary[0].days} · ${fmt(MO.summary[0].building_kwh_day)} kWh/day</dd><dt>Non-working days</dt><dd>${MO.summary[1].days} · ${fmt(MO.summary[1].building_kwh_day)} kWh/day</dd><dt>A/C, non-working day</dt><dd>${fmt(MO.summary[1].ac_after_kwh_day_measured)} kWh/day</dd></dl></div>
    </div>`;
}

const ROWS = {
  problem: () => [{ label: "All 15-min windows", sub: "share of energy", AC: E.shares.ac_share_energy_pct, LIGHT: E.shares.light_share_energy_pct, OTHER: 100 - E.shares.ac_share_energy_pct - E.shares.light_share_energy_pct },
                  { label: "Top 5% windows", sub: "share of peak", AC: E.shares.ac_share_peak_pct, LIGHT: E.shares.light_share_peak_pct, OTHER: 100 - E.shares.ac_share_peak_pct - E.shares.light_share_peak_pct }],
  drivers: () => [{ label: "Measured", sub: "sub-meters", AC: pd.ac_measured, LIGHT: pd.light_measured, OTHER: 100 - pd.ac_measured - pd.light_measured },
                  { label: "Estimated", sub: "main meter only", AC: pd.ac_estimated, LIGHT: pd.light_estimated, OTHER: 100 - pd.ac_estimated - pd.light_estimated }],
};

// ---------- rendering + navigation ----------
const main = $("#main"), rail = $("#rail");
let cur = -1;
function mountCharts(root) {
  root.querySelectorAll("[data-chart]").forEach(el => {
    const w = Math.max(260, Math.floor(el.clientWidth));
    el.innerHTML = el.dataset.rows ? charts[el.dataset.chart](w, ROWS[el.dataset.rows]()) : charts[el.dataset.chart](w);
  });
  root.querySelectorAll("[data-cross]").forEach(bindCross);
}
function bindCross(svg) {
  const hit = svg.querySelector(".hit"), xh = svg.querySelector(".xh"), L = +hit.dataset.l, R = +hit.dataset.r, xs = E.series.t;
  const at = e => { const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
    const target = xs[0] + (vx - L) / (R - L) * (xs[xs.length - 1] - xs[0]); let i = 0, best = Infinity;
    xs.forEach((v, j) => { const d = Math.abs(v - target); if (d < best) { best = d; i = j; } }); return [i, L + (xs[i] - xs[0]) / (xs[xs.length - 1] - xs[0]) * (R - L)]; };
  hit.addEventListener("pointermove", e => { const [i, x] = at(e); xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
    showTip(`<div class="t">${tLabel(tAt(xs[i]))}</div>${dot("--ac")}Estimated <b>${fmt(E.series.ac_pred[i], 1)} kW</b><br>${dot("--ink")}Measured <b>${fmt(E.series.ac[i], 1)} kW</b><br><span style="opacity:.75">Building ${fmt(E.series.building[i], 1)} kW</span>`, e.clientX, e.clientY); });
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
}
function renderDash(flash) {
  const box = $("#dash"); if (!box) return;
  box.innerHTML = dashBody(); mountCharts(box);
  if (!flash) box.querySelectorAll(".flash").forEach(el => el.classList.remove("flash"));
}
function go(i, opts = {}) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (i === cur && !opts.force) return;
  cur = i; const s = STEPS[i]; hideTip();
  main.innerHTML = `<section class="step pad${s.wide ? " wide" : ""}" aria-label="${esc(s.title)}">${s.render()}</section>`;
  const sec = main.firstElementChild;
  [...sec.querySelectorAll(".copy > *")].forEach((el, k) => el.style.setProperty("--k", k));
  mountCharts(sec); renderDash(false);
  if (!opts.still) requestAnimationFrame(() => sec.classList.add("play"));
  main.scrollTop = 0;
  rail.querySelectorAll("button").forEach((b, j) => { b.toggleAttribute("aria-current", j === i); if (j === i) b.setAttribute("aria-current", "step"); b.classList.toggle("done", j < i); });
  $("#counter").textContent = `${i} / ${STEPS.length - 1}`;
  $("#compact").textContent = `${i}/${STEPS.length - 1} · ${s.phase}`;
  $("#prev").disabled = i === 0; $("#next").disabled = i === STEPS.length - 1;
  $("#notesText").textContent = s.notes;
  const h = i === STEPS.length - 1 ? "#dashboard" : `#step-${i}`;
  if (location.hash !== h) history.replaceState(null, "", h);
  document.title = i ? `${s.title} · Who Sets the Peak?` : "Who Sets the Peak?";
}
const SHORT = {"Intro": "Intro", "Business understanding": "Business", "Data understanding": "Data", "Data preparation": "Preparation", "Modeling": "Modeling", "Evaluation": "Evaluation", "Deployment": "Deployment", "Monitoring & maintenance": "Monitoring"};
rail.innerHTML = STEPS.map((s, i) => `<button aria-label="Step ${i}: ${esc(s.title)} (${esc(s.phase)})" class="${i && STEPS[i - 1].phase === s.phase && !s.wide ? "cont" : ""}"><span class="ph">${s.wide ? "Dashboard" : esc(SHORT[s.phase])}</span><span class="bar"></span></button>`).join("");
rail.querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => go(i)));
$("#prev").addEventListener("click", () => go(cur - 1));
$("#next").addEventListener("click", () => go(cur + 1));
const notes = $("#notes"), notesBtn = $("#notesBtn");
const toggleNotes = () => { notes.hidden = !notes.hidden; notesBtn.setAttribute("aria-pressed", String(!notes.hidden)); };
notesBtn.addEventListener("click", toggleNotes);
main.addEventListener("click", e => {
  const b = e.target.closest("[data-trim],[data-hours]"); if (!b) return;
  if (b.dataset.trim) state.trim = +b.dataset.trim; else state.hours = b.dataset.hours;
  main.querySelectorAll("[data-trim]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.trim === state.trim)));
  main.querySelectorAll("[data-hours]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.hours === state.hours)));
  renderDash(true);
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (["ArrowRight", "PageDown"].includes(k) || (k === " " && !e.target.closest("button"))) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (k === "Home") go(0); else if (k === "End" || k === "d" || k === "D") go(STEPS.length - 1);
  else if (/^[0-9]$/.test(k)) go(+k);
  else if (k === "n" || k === "N") toggleNotes();
});
const fromHash = () => { const h = location.hash.slice(1); return h === "dashboard" ? STEPS.length - 1 : /^step-\d+$/.test(h) ? +h.slice(5) : 0; };
addEventListener("hashchange", () => go(fromHash()));
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => go(cur, { force: true, still: true }), 150); });
go(fromHash(), { force: true });
})();
</script>
