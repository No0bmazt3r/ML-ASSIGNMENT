<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Sets the Peak?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>try { const t = localStorage.getItem("wsp-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* A meter-panel presenter. Header: title + circular stepper. Each step fills the viewport:
   copy on the left (facts pinned to the bottom), instrument panels on the right stretching to full height. */
:root {
  --bg: #eceff3; --surface: #ffffff; --surface2: #f4f6f9; --ink: #0b1420; --ink2: #3b4757; --muted: #657182;
  --grid: #e3e7ec; --axis: #c2c9d2; --wash: rgba(11,20,32,.05);
  --ac: #1f6fd1; --ac-wash: rgba(31,111,209,.14); --light: #e0612c; --pv: #179c6c; --other: #bcc3cc;
  --m0: #0f8b8d; --m1: #d99200; --bad: #cc3333; --bad-text: #b3261e;
  --on-ink: var(--bg);
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.7,.2,1); --spring: cubic-bezier(.34,1.4,.5,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0d11; --surface: #12171e; --surface2: #181f28; --ink: #edf1f5; --ink2: #b3bdc8; --muted: #8590a0;
  --grid: #222a34; --axis: #384350; --wash: rgba(255,255,255,.05);
  --ac: #4a92ec; --ac-wash: rgba(74,146,236,.2); --light: #e46a35; --pv: #22b07c; --other: #444e5a;
  --m0: #2bb3b0; --m1: #e0a325; --bad: #e66767; --bad-text: #ff8a85; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a0d11; --surface: #12171e; --surface2: #181f28; --ink: #edf1f5; --ink2: #b3bdc8; --muted: #8590a0;
  --grid: #222a34; --axis: #384350; --wash: rgba(255,255,255,.05);
  --ac: #4a92ec; --ac-wash: rgba(74,146,236,.2); --light: #e46a35; --pv: #22b07c; --other: #444e5a;
  --m0: #2bb3b0; --m1: #e0a325; --bad: #e66767; --bad-text: #ff8a85; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); font-variant-numeric: tabular-nums; transition: background .3s var(--ease), color .3s var(--ease); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.pad { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 3px; border-radius: 6px; }

/* ---------- header ---------- */
header { background: var(--surface); padding-top: 14px; padding-bottom: 8px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px 32px; transition: background .3s var(--ease); }
.brand b { display: block; font: 700 22px/1.1 var(--display); letter-spacing: -.01em; }
.brand span { font-size: 13.5px; color: var(--muted); }
.tools { display: flex; gap: 8px; }
.iconbtn { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--surface2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; transition: background .2s var(--ease), transform .2s var(--spring); }
.iconbtn:hover { background: var(--wash); }
.iconbtn:active { transform: scale(.94); }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn .moon { display: none; }
:root[data-theme="dark"] .iconbtn .sun { display: none; }
:root[data-theme="dark"] .iconbtn .moon { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .iconbtn .sun { display: none; } :root:not([data-theme="light"]) .iconbtn .moon { display: block; } }

/* circular stepper */
.stepper { grid-column: 1 / -1; display: flex; align-items: flex-start; padding: 10px 30px 28px; }
.st { flex: none; position: relative; border: 0; background: none; padding: 0; cursor: pointer; width: 46px; height: 46px; }
.st .dot { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: inset 0 0 0 2px var(--axis); color: var(--muted); transition: background .35s var(--ease) var(--dl, 0ms), box-shadow .35s var(--ease) var(--dl, 0ms), color .35s var(--ease) var(--dl, 0ms), transform .35s var(--spring) var(--dl, 0ms); }
.st .dot svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.st .dot .ck, .st .dot .ic { position: absolute; }
.st .dot .ck { opacity: 0; transform: scale(.4); transition: opacity .25s var(--ease) var(--dl, 0ms), transform .3s var(--spring) var(--dl, 0ms); }
.st .dot .n { font: 600 15px/1 var(--body); }
.st .dot .ic { opacity: 0; transform: scale(.5); transition: opacity .25s var(--ease) var(--dl, 0ms), transform .3s var(--spring) var(--dl, 0ms); }
.st .lb { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color .3s var(--ease) var(--dl, 0ms); }
.st:hover .dot { box-shadow: inset 0 0 0 2px var(--ink2); }
.st.done .dot { background: var(--ac); box-shadow: inset 0 0 0 2px var(--ac); color: #fff; }
.st.done .dot .ck { opacity: 1; transform: none; }
.st.done .dot .n { opacity: 0; }
.st.done .lb { color: var(--ink2); }
.st[aria-current="step"] .dot { background: var(--surface); box-shadow: inset 0 0 0 3px var(--ac); color: var(--ac); transform: scale(1.12); }
.st[aria-current="step"] .dot .ic { opacity: 1; transform: none; }
.st[aria-current="step"] .dot .n { opacity: 0; }
.st[aria-current="step"] .lb { color: var(--ink); font-weight: 600; }
.st[aria-current="step"] .dot::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--ac); opacity: 0; animation: ring 2.4s var(--ease) infinite; }
@keyframes ring { 0% { opacity: .55; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.18); } }
.ln { flex: 1; height: 4px; margin: 21px 6px 0; border-radius: 2px; background: var(--grid); position: relative; overflow: hidden; min-width: 12px; }
.ln > i { position: absolute; inset: 0; background: var(--ac); border-radius: 2px; transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease) var(--ldl, 0ms); }
.ln.done > i { transform: none; }
.ln.next::after { content: ""; position: absolute; top: -1px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--ac); animation: flow 1.8s var(--ease) infinite; }
@keyframes flow { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: calc(100% - 6px); opacity: 0; } }

/* ---------- stage ---------- */
main { overflow: auto; min-height: 0; scrollbar-width: none; }
main::-webkit-scrollbar, html::-webkit-scrollbar { display: none; }
html { scrollbar-width: none; }
.step { min-height: 100%; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); grid-template-rows: minmax(0, 1fr); gap: 40px; padding-top: clamp(12px, 2.4vh, 28px); padding-bottom: clamp(12px, 2.4vh, 28px); max-width: 1800px; margin: 0 auto; }
@media (min-width: 1101px) { .step:not(.wide) { height: 100%; } }
.step.wide { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: 20px; }
.copy { display: flex; flex-direction: column; gap: clamp(8px, 1.7vh, 18px); min-width: 0; min-height: 0; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(40px, min(7.4vw, 9.6vh), 124px); line-height: .92; }
h2 { font-size: clamp(26px, min(3.3vw, 5.3vh), 54px); line-height: 1.02; }
.lede { font-size: clamp(15px, min(1.35vw, 2.3vh), 22px); color: var(--ink2); margin: 0; max-width: 46ch; }
.facts { margin-top: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.fact { background: var(--surface); border-radius: 14px; padding: clamp(9px, 1.5vh, 16px) 18px; display: grid; gap: 4px; align-content: start; transition: background .3s var(--ease), transform .25s var(--spring); }
.fact:hover { transform: translateY(-2px); }
.fact b { font: 700 clamp(22px, min(2.4vw, 3.9vh), 40px)/1 var(--display); letter-spacing: -.01em; }
.fact b small { font: 600 .5em var(--body); color: var(--ink2); margin-left: 3px; }
.fact span { font-size: clamp(12.5px, 1.6vh, 14px); color: var(--muted); line-height: 1.35; }
.fact.ac b { color: var(--ac); }
.viz { display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 18px); min-width: 0; min-height: 0; }
.panel { background: var(--surface); border-radius: 16px; padding: clamp(12px, 2vh, 20px) 22px clamp(10px, 1.6vh, 16px); min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; flex: 1 1 0; transition: background .3s var(--ease); }
.panel.fixed { flex: none; }
.panel h3 { margin: 0; font: 600 17px/1.3 var(--body); }
.panel .sub { margin: -6px 0 0; font-size: 14px; color: var(--muted); }
.chart { position: relative; flex: 1 1 auto; min-height: min(var(--minh, 220px), 17vh); min-width: 0; }
.chart > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
.chart.short { flex: none; height: 54px; min-height: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink2); }
.legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 7px; }
.legend i.sq { width: 11px; height: 11px; border-radius: 3px; }
.row2 { flex: 1 1 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; min-height: 0; }
code { font: 14px/1.3 var(--mono); background: var(--wash); padding: 1px 6px; border-radius: 5px; }

/* preparation: vertical icon timeline */
.fixes { --ico: clamp(30px, 4.4vh, 44px); display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.fixes li { display: grid; grid-template-columns: var(--ico) minmax(0, 1fr); gap: 0 14px; position: relative; padding-bottom: clamp(4px, 1.3vh, 14px); }
.fixes li::before { content: ""; position: absolute; left: calc(var(--ico) / 2 - 1px); top: var(--ico); bottom: 0; width: 2px; background: var(--grid); }
.fixes li:last-child::before { display: none; }
.fixes li::after { content: ""; position: absolute; left: calc(var(--ico) / 2 - 1px); top: var(--ico); bottom: 0; width: 2px; background: var(--ac); transform: scaleY(0); transform-origin: top; }
.fixes li:last-child::after { display: none; }
.fixes .ico { grid-row: span 2; width: var(--ico); height: var(--ico); border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ac); box-shadow: inset 0 0 0 2px var(--ac); }
.fixes .ico svg { width: calc(var(--ico) * .45); height: calc(var(--ico) * .45); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fixes b { font-weight: 600; padding-top: calc((var(--ico) - 26px) / 2); font-size: clamp(15px, 1.9vh, 17px); }
.fixes p { margin: 0; color: var(--ink2); font-size: clamp(13.5px, 1.75vh, 16px); line-height: 1.45; }
.fixes p b { color: var(--ink); padding: 0; }
.play .fixes li { animation: rise .5s var(--ease) both; animation-delay: calc(250ms + var(--k, 0) * 180ms); }
.play .fixes .ico { animation: popin .45s var(--spring) both; animation-delay: calc(250ms + var(--k, 0) * 180ms); }
.play .fixes li::after { animation: grow .4s var(--ease) forwards; animation-delay: calc(420ms + var(--k, 0) * 180ms); }
@keyframes grow { to { transform: scaleY(1); } }
@keyframes popin { from { transform: scale(.3); opacity: 0; } }

/* limits cards */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { border-radius: 14px; padding: clamp(10px, 1.6vh, 16px) 16px; background: var(--surface); display: grid; gap: 6px; align-content: start; transition: transform .25s var(--spring); }
.card:hover { transform: translateY(-2px); }
.card b { font-weight: 600; }
.card p { margin: 0; color: var(--ink2); font-size: clamp(13px, 1.65vh, 15px); line-height: 1.45; }
.card .affects { font-size: clamp(12px, 1.5vh, 13.5px); color: var(--muted); }
.flag { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; color: var(--bad-text); }

/* ---------- dashboard ---------- */
.dhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 40px; align-items: end; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; background: var(--surface2); color: var(--ink2); font-size: 15px; max-width: 80ch; }
.controls { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; }
.seg { display: grid; gap: 8px; }
.seg > span { font-size: 14px; font-weight: 600; color: var(--ink2); }
.seg div { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 0 18px; min-height: 40px; min-width: 64px; cursor: pointer; font-weight: 600; font-size: 15px; transition: background .2s var(--ease), color .2s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--wash); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.step.wide { padding-top: 20px; padding-bottom: 20px; gap: 16px; }
.step.wide h2 { font-size: clamp(28px, 2.5vw, 42px); }
.step.wide .banner { padding: 10px 16px; font-size: 14.5px; max-width: none; }
.dhead .copy { min-width: 0; }
.kpi { background: var(--surface); border-radius: 16px; padding: 14px 18px; display: grid; gap: 6px; align-content: start; }
.kpi .label { font-size: 15px; color: var(--ink2); font-weight: 500; }
.kpi .value { font: 700 clamp(30px, 2.7vw, 46px)/1 var(--display); letter-spacing: -.01em; }
.kpi .value small { font: 600 18px/1 var(--body); color: var(--ink2); margin-left: 4px; }
.kpi .note { font-size: 14px; color: var(--muted); }
.kpi .value.flash { animation: flash .6s var(--ease); }
.dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) auto; gap: 16px; min-height: 0; }
.dgrid .panel { flex: none; }
.recs { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; counter-reset: rec; }
.recs li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; color: var(--ink2); font-size: 15.5px; counter-increment: rec; }
.recs li::before { content: counter(rec); font: 700 14px/30px var(--body); text-align: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ac); color: #fff; }
.recs b { color: var(--ink); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; font-size: 15px; margin: 0; }
.kv dt { color: var(--ink2); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }

/* ---------- team ---------- */
.step.team { grid-template-rows: auto minmax(0, 1fr); }
.thead { text-align: center; display: grid; gap: 6px; justify-items: center; }
.thead h2 { font-size: clamp(36px, min(4.4vw, 7vh), 72px); }
.thead p { margin: 0; color: var(--ink2); font-size: clamp(15px, 2vh, 19px); }
.thead .course { color: var(--ac); font-weight: 600; }
.members { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(12px, 1.4vw, 22px); min-height: 0; }
.member { position: relative; min-height: 0; perspective: 1400px; cursor: pointer; border-radius: 18px; outline-offset: 4px; }
.member .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s var(--spring); }
.member.flipped .flip { transform: rotateY(180deg); }
.member .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; background: var(--surface); padding: clamp(14px, 2vh, 22px) 16px clamp(14px, 2vh, 22px); display: grid; grid-template-rows: minmax(0, 1fr) auto auto auto auto; justify-items: center; text-align: center; gap: 8px; transition: transform .3s var(--spring); }
.member:hover .front { transform: translateY(-4px); }
.member .back { transform: rotateY(180deg); background: var(--ac); color: #fff; grid-template-rows: none; align-content: center; gap: clamp(8px, 1.6vh, 14px); padding: 22px 18px; }
.member .back .bn { font: 700 clamp(19px, 2.6vh, 24px)/1.2 var(--display); }
.member .back dl { margin: 0; display: grid; gap: clamp(6px, 1.2vh, 10px); width: 100%; }
.member .back dt { font-size: 12.5px; opacity: .78; }
.member .back dd { margin: 0; font-weight: 600; font-size: clamp(14px, 1.8vh, 16px); line-height: 1.35; }
.member .back a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
.member .back .hint, .member .front .hint { font-size: 12px; opacity: .7; }
.member .ph { position: relative; width: 100%; height: 100%; min-height: 140px; border-radius: 14px; overflow: hidden; }
.member .ph::before { content: ""; position: absolute; left: 50%; bottom: 0; width: min(96%, 44vh); aspect-ratio: 1; transform: translate(-50%, 18%); border-radius: 50%; background: var(--surface2); }
.member img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; transform-origin: bottom center; transition: transform .35s var(--spring); }
.member:hover img { transform: scale(1.03); }
.member .ph.noimg { display: grid; place-items: center; }
.member .ph.noimg::before { display: none; }
.member .mono { position: relative; width: min(70%, 22vh); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--ac-wash); color: var(--ac); font: 700 clamp(36px, 6vh, 64px)/1 var(--display); }
.member .front b { font-size: clamp(15px, 1.9vh, 18px); line-height: 1.25; min-height: 2.5em; display: flex; align-items: center; }
.member .sid { font-weight: 600; font-size: 14px; color: var(--ac); background: var(--ac-wash); padding: 3px 10px; border-radius: 6px; letter-spacing: .03em; }
.member .role { font-size: clamp(12.5px, 1.6vh, 14px); color: var(--muted); line-height: 1.35; min-height: 2.7em; }

/* ---------- footer ---------- */
footer { background: var(--surface); padding-top: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; transition: background .3s var(--ease); }
.navbtn { min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--surface2); cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; transition: background .2s var(--ease), transform .2s var(--spring); }
.navbtn:hover { background: var(--wash); }
.navbtn:active { transform: scale(.96); }
.navbtn.primary { background: var(--ac); color: #fff; }
.navbtn.primary:hover { background: var(--ac); filter: brightness(1.08); }
.navbtn.primary svg { animation: nudge 1.6s var(--ease) infinite; }
@keyframes nudge { 0%, 60%, 100% { transform: none; } 30% { transform: translateX(4px); } }
.navbtn:disabled { opacity: .35; cursor: default; }
.navbtn:disabled svg { animation: none; }
.where { font-size: 15px; color: var(--ink2); margin-left: 6px; }
.where b { color: var(--ink); }
.keys { margin-left: auto; font-size: 14px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
kbd { font: 500 12px/1 var(--mono); padding: 4px 6px; border-radius: 5px; background: var(--surface2); color: var(--ink2); }

/* tooltip */
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--on-ink); font: 14px/1.45 var(--body); padding: 9px 12px; border-radius: 10px; max-width: 300px; box-shadow: 0 8px 24px rgba(0,0,0,.22); transition: opacity .12s var(--ease); }
.tip .t { font-size: 12.5px; opacity: .72; margin-bottom: 2px; }
.tip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

/* SVG text + marks */
.chart text { fill: var(--ink2); font: 14px var(--body); }
.chart text.m { fill: var(--muted); font: 13px var(--body); }
.chart text.v { fill: var(--ink); font: 600 14px var(--body); }
.chart text.in { fill: #fff; font: 600 14px var(--body); }
.chart text.oi { fill: var(--on-ink); font: 600 15px var(--body); }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .ax { stroke: var(--axis); stroke-width: 1.5; }
.chart [data-tip] { cursor: pointer; transition: opacity .15s var(--ease); }
.chart rect[data-tip]:hover, .chart circle[data-tip]:hover { opacity: .78; }
.chart .hl { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }

/* motion: elements rest in their final state; .play adds the entry animation */
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes gx { from { transform: scaleX(0); } }
@keyframes gy { from { transform: scaleY(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

<script>
(() => {
"use strict";
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 0) => fmt(v, d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lin = (d0, d1, r0, r1) => v => r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ticks(max, n = 4) {
  const raw = max / n, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(6)); return out;
}
const niceMax = (max, n = 4) => { const t = ticks(max, n); return t[t.length - 1] < max ? t[t.length - 1] + (t[1] - t[0]) : t[t.length - 1]; };
const tip = $("#tip");
const showTip = (html, x, y) => { tip.innerHTML = html; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x + 16)) + "px"; tip.style.top = (y - h - 14 < 8 ? y + 18 : y - h - 14) + "px"; };
const hideTip = () => { tip.hidden = true; };
document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointermove", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointerout", e => { if (e.target.closest("[data-tip]")) hideTip(); });
const tipAttr = html => `data-tip="${esc(html)}"`;
const dot = c => `<i style="background:var(${c})"></i>`;

const E = D.evaluate, M = D.method, S = D.scenarios, X = D.data, MO = D.modes;
const acTest = E.metrics.ac, lgTest = E.metrics.light;
const frozenAc = acTest.find(m => m.frozen), tod = acTest.find(m => m.model === "time_of_day"), ridge = acTest.find(m => m.model === "ridge");
const GROUP = { power: "Power", harmonics: "Harmonics", power_quality: "Power quality", temporal: "Temporal (lags)", calendar: "Calendar" };
const t0 = new Date(E.series.t0);
const tAt = i => new Date(t0.getTime() + i * 15 * 60000);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const hh = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const tLabel = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${hh(d)}`;
const sh = S.peak_shaving, ah = S.after_hours, pd = S.peak_drivers_week6_pct, sp = S.solar_and_precooling;
const ABL = M.ablation || [];
const cvTod = M.cv.ac.find(r => r.model === "time_of_day");

// peak windows of the test week by hour of day (computed from the same 15-minute series the hero draws)
const PEAK_HOURS = (() => {
  const b = E.series.building.filter(v => v != null), s = [...b].sort((p, q) => p - q), thr = s[Math.floor(.95 * (s.length - 1))];
  const n = Array(24).fill(0); E.series.building.forEach((v, i) => { if (v != null && v >= thr) n[tAt(E.series.t[i]).getHours()]++; });
  return { n, thr, total: n.reduce((a, c) => a + c, 0) };
})();

// ---------- chart builders: (w, h, rows?) -> SVG string sized to the container ----------
function linePath(xs, ys, x, y) {
  let d = "", prev = null;
  xs.forEach((xi, i) => { const v = ys[i]; if (v == null) { prev = null; return; }
    d += (prev == null || xi - prev > 1 ? "M" : "L") + x(xi).toFixed(1) + "," + y(v).toFixed(1); prev = xi; });
  return d;
}
function dayTicks(xs, x, H, top) {
  let s = ""; const R = x(xs[xs.length - 1]);
  xs.forEach(i => { const d = tAt(i); if (d.getHours() === 0 && d.getMinutes() === 0) {
    s += `<line class="gl" x1="${x(i)}" x2="${x(i)}" y1="${top}" y2="${H}"/>` + (R - x(i) > 50 ? `<text class="m" x="${x(i) + 6}" y="${H + 18}">${DOW[d.getDay()]} ${d.getDate()}</text>` : ""); } });
  return s;
}
function yAxis(tk, y, L, R) {
  return tk.map(v => `<line class="gl" x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}"/><text class="m" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("");
}
const svg = (w, h, label, body, extra = "") => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" ${extra}>${body}</svg>`;

const charts = {
  // intro: the test week's building load drawing itself, with a crosshair
  hero(w, h) {
    const L = 40, R = w - 10, T = 26, B = h - 28, xs = E.series.t, mx = niceMax(Math.max(...E.series.building) * 1.08);
    const x = lin(xs[0], xs[xs.length - 1], L, R), y = lin(0, mx, B, T);
    const pi = E.series.building.indexOf(Math.max(...E.series.building));
    const area = linePath(xs, E.series.ac, x, y) + `L${x(xs[xs.length - 1])},${B}L${x(xs[0])},${B}Z`;
    const px = x(xs[pi]), lx = px + 14 > R - 260 ? px - 14 : px + 14;
    return svg(w, h, `Building demand over the test week, peak ${E.peak.kw} kW on ${E.peak.t}`, `
      ${yAxis(ticks(mx), y, L, R)}${dayTicks(xs, x, B, T)}<text class="m" x="${L}" y="${T - 10}">kW</text>
      <path d="${area}" fill="var(--ac-wash)" class="a-fade" style="--d:1500"/>
      <path d="${linePath(xs, E.series.building, x, y)}" pathLength="1" class="a-draw" style="--dur:2200ms" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <g class="a-pop" style="--d:2000"><circle cx="${px}" cy="${y(E.series.building[pi])}" r="6" fill="var(--ac)" stroke="var(--surface)" stroke-width="2.5"/></g>
      <text class="v a-fade" style="--d:2100" x="${lx}" y="${y(E.series.building[pi]) + 5}" text-anchor="${lx < px ? "end" : "start"}">${fmt(E.peak.kw, 1)} kW peak · ${E.peak.t}</text>
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${B}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/>
      <rect class="hit" x="${L}" y="${T}" width="${R - L}" height="${B - T}" fill="transparent" data-l="${L}" data-r="${R}"/>`, `data-cross="hero"`);
  },
  // problem + dashboard: share bars
  shares(w, h, rows) {
    const L = clamp(w * .3, 120, 190), R = w - 10, band = h / rows.length, rowH = clamp(band * .42, 30, 64);
    const x = lin(0, 100, L, R), segs = [["AC", "--ac", "A/C"], ["LIGHT", "--light", "Lighting & sockets"], ["OTHER", "--other", "Everything else"]];
    let s = "";
    rows.forEach((r, i) => {
      const y0 = i * band + (band - rowH) / 2; let acc = 0;
      s += `<text x="0" y="${y0 + rowH / 2 - 2}" style="font-weight:600;fill:var(--ink)">${r.label}</text><text class="m" x="0" y="${y0 + rowH / 2 + 17}">${r.sub}</text>`;
      segs.forEach(([k, c, name], j) => {
        const v = r[k], x0 = x(acc) + (j ? 2 : 0), x1 = x(acc + v) - (j < 2 ? 2 : 0); acc += v;
        const wd = Math.max(0, x1 - x0);
        s += `<rect class="a-gx" style="--d:${300 + i * 350 + j * 120}" x="${x0}" y="${y0}" width="${wd}" height="${rowH}" rx="8" fill="var(${c})" ${tipAttr(`<div class="t">${r.label} · ${r.sub}</div>${dot(c)}${name}: <b>${pct(v, 1)}</b>`)}/>`;
        if (wd > 54) s += `<text class="${k === "OTHER" ? "v" : "in"} a-fade" style="--d:${900 + i * 350};font-size:${clamp(rowH * .34, 14, 20)}px" x="${x0 + 12}" y="${y0 + rowH / 2 + 6}" pointer-events="none">${pct(v)}</text>`;
      });
    });
    return svg(w, h, "Share of building load by end use", s);
  },
  // problem: when the peaks happen
  peakhours(w, h) {
    const L = 34, R = w - 6, T = 22, B = h - 26, n = PEAK_HOURS.n, st = Math.max(1, Math.ceil(Math.max(...n) / 4)), mx = st * Math.ceil(Math.max(...n) / st), tk = Array.from({ length: mx / st + 1 }, (_, k) => k * st);
    const cw = (R - L) / 24, x = i => L + i * cw, y = lin(0, mx, B, T);
    let s = yAxis(tk, y, L, R) + `<text class="m" x="${L}" y="${T - 8}">peak windows</text>`;
    const office = `<rect x="${x(8)}" y="${T}" width="${cw * 9}" height="${B - T}" fill="var(--wash)" rx="6"/><text class="m" x="${x(8) + 8}" y="${T + 16}">office hours 08–17</text>`;
    s = office + s;
    n.forEach((v, i) => {
      s += `<rect class="a-gy" style="--d:${200 + i * 30}" x="${x(i) + 3}" y="${v ? y(v) : B - 2}" width="${cw - 6}" height="${v ? B - y(v) : 2}" rx="4" fill="${v ? "var(--ac)" : "var(--grid)"}" ${tipAttr(`<div class="t">${String(i).padStart(2, "0")}:00–${String(i).padStart(2, "0")}:59</div><b>${v}</b> of ${PEAK_HOURS.total} peak windows (≥ ${fmt(PEAK_HOURS.thr, 1)} kW)`)}/>`;
      if (i % 3 === 0) s += `<text class="m" x="${x(i) + cw / 2}" y="${B + 18}" text-anchor="middle">${String(i).padStart(2, "0")}</text>`;
    });
    return svg(w, h, "Number of top-5% demand windows by hour of day, test week", s);
  },
  // data: file availability grid
  grid(w, h) {
    const L = 72, cols = X.circuits.length, cw = (w - L) / cols, rh = clamp((h - 26) / X.grid.length, 28, 64);
    let s = X.circuits.map((c, j) => `<text class="m" x="${L + j * cw + cw / 2}" y="14" text-anchor="middle">${c}</text>`).join("");
    X.grid.forEach((row, i) => {
      const wk = X.folders[i], y0 = 24 + i * rh;
      s += `<text x="0" y="${y0 + rh / 2 + 5}" style="font-weight:600;fill:var(--ink)">Week ${wk}</text>`;
      row.forEach((ok, j) => {

    const cw = (R - L) / rows.length, bw = Math.min(90, cw * .5);
    let s = yAxis(ticks(mx, 3), y, L, R) + `<text class="m" x="${L}" y="${T - 16}">kW off the period's maximum demand</text>`;
    rows.forEach((r, i) => {
      const cx = L + cw * i + cw / 2, t = tipAttr(`<b>Trim A/C ${r.trim_pct}%</b> when demand ≥ ${fmt(sh.trigger_kw, 1)} kW<br>Cut ${fmt(r.max_demand_cut_kw, 1)} kW (model) · ${fmt(r.week6_cut_kw_measured, 1)} kW with the real sub-meter, week 6<br>RM ${fmt(r.rm_per_year[0])}–${fmt(r.rm_per_year[1])} per year`);
      s += `<rect class="a-gy" style="--d:${300 + i * 200}" x="${cx - bw / 2}" y="${y(r.max_demand_cut_kw)}" width="${bw}" height="${B - y(r.max_demand_cut_kw)}" rx="8" fill="var(--ac)" ${t}/>
        <line class="a-fade" style="--d:${900 + i * 200}" x1="${cx - bw / 2 - 8}" x2="${cx + bw / 2 + 8}" y1="${y(r.week6_cut_kw_measured)}" y2="${y(r.week6_cut_kw_measured)}" stroke="var(--ink)" stroke-width="2.5" ${t}/>
        <text class="v a-fade" style="--d:${800 + i * 200};font-size:16px" x="${cx}" y="${y(Math.max(r.max_demand_cut_kw, r.week6_cut_kw_measured)) - 10}" text-anchor="middle">${fmt(r.max_demand_cut_kw, 1)} kW</text>
        <text x="${cx}" y="${B + 20}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${r.trim_pct}% trim</text>
        <text class="m" x="${cx}" y="${B + 38}" text-anchor="middle">RM ${fmt(r.rm_per_year[0] / 1000, 1)}k–${fmt(r.rm_per_year[1] / 1000, 1)}k/yr</text>`;
    });
    return svg(w, h, "Maximum-demand cut for 10, 20 and 30 percent A/C trim", s);
  },
  // sustainability: pre-cooling windows (negative = peak went up)
  precool(w, h) {
    const rows = sp.windows, L = 84, R = w - 10, band = (h - 32) / rows.length, bh = clamp(band * .5, 16, 30);
    const lo = Math.min(...rows.map(r => r.max_demand_cut_kw)), mx = Math.max(1, ...rows.map(r => r.max_demand_cut_kw));
    const x = lin(Math.floor(lo) - 1, mx, L, R), z = x(0);
    let s = `<line class="ax" x1="${z}" x2="${z}" y1="0" y2="${rows.length * band}"/><text class="m" x="${z}" y="${h - 8}" text-anchor="end">no change</text>
      <text class="m" x="${L}" y="${h - 8}">← peak goes up</text>`;
    rows.forEach((r, i) => {
      const y0 = i * band + (band - bh) / 2, v = r.max_demand_cut_kw;
      s += `<text x="0" y="${y0 + bh / 2 + 5}" style="font-weight:600;fill:var(--ink)">${r.window}h</text>`;
      if (v < 0) s += `<rect class="a-gx" style="--d:${300 + i * 160};transform-origin:right center" x="${x(v)}" y="${y0}" width="${z - x(v)}" height="${bh}" rx="${bh / 2}" fill="var(--bad)" ${tipAttr(`Moving ${sp.precool_shift_pct}% of 14–16h A/C into <b>${r.window}h</b><br>raises the period's maximum by ${fmt(-v, 1)} kW (${fmt(-r.week6_max_cut_kw_measured_ac, 1)} kW with the real sub-meter)<br>Sun at ${fmt(r.pv_irradiance_vs_peak_pct)}% of its peak`)}/>
        <text class="v a-fade" style="--d:${800 + i * 160}" x="${x(v) - 8}" y="${y0 + bh / 2 + 5}" text-anchor="end">+${fmt(-v, 1)} kW</text>`;
      else s += `<circle cx="${z}" cy="${y0 + bh / 2}" r="6" fill="var(--ink2)" ${tipAttr(`<b>${r.window}h</b>: no change to the period's maximum<br>Sun at ${fmt(r.pv_irradiance_vs_peak_pct)}% of its peak`)}/><text class="m" x="${z - 14}" y="${y0 + bh / 2 + 5}" text-anchor="end">0 kW · sun at ${fmt(r.pv_irradiance_vs_peak_pct)}% of its peak</text>`;
    });
    return svg(w, h, "Effect of fixed pre-cooling windows on maximum demand", s);
  },
  // limits: CRISP-ML(Q) as a clockwise cycle; filled = done in this project, dashed = proposed next
  loop(w, h) {
    const ph = [
      { n: "Business & data understanding", ic: "target", d: "Demand charge set by the peak; CLEMD files audited", done: 1 },
      { n: "Data preparation", ic: "funnel", d: `6 fixes, ${fmt(X.rows)} clean minutes`, done: 1 },
      { n: "Modeling", ic: "chip", d: `5 models, ${M.frozen.ac.name} frozen by rule`, done: 1 },
      { n: "Evaluation", ic: "chart", d: `Sealed week: MAE ${fmt(frozenAc.mae, 2)} kW`, done: 1 },
      { n: "Deployment", ic: "gauge", d: "Demand-triggered trim (scenario so far)", done: 0 },
      { n: "Monitoring & maintenance", ic: "clock", d: "Sub-meter pilot, monthly drift checks", done: 0 }];
    const cx = w / 2, cy = h / 2 + 4, rx = Math.min(w * .27, 330), ry = Math.min(h * .33, 240), N = ph.length, r = 26;
    const P = t => [cx + rx * Math.cos(t), cy + ry * Math.sin(t)], ang = i => -Math.PI / 2 + i * 2 * Math.PI / N;
    const wrap = (txt, m) => txt.split(" ").reduce((ls, wd) => { const l = ls[ls.length - 1]; (l && (l + " " + wd).length <= m) ? ls[ls.length - 1] = l + " " + wd : ls.push(wd); return ls; }, []);
    let s = `<defs><marker id="loopArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
    const ring = Array.from({ length: 121 }, (_, k) => P(-Math.PI / 2 + k * 2 * Math.PI / 120)).map((q, k) => (k ? "L" : "M") + q[0].toFixed(1) + "," + q[1].toFixed(1)).join("") + "Z";
    s += `<path id="loopRing" d="${ring}" fill="none" stroke="var(--grid)" stroke-width="10" stroke-linecap="round"/>`;
    // clockwise arcs between neighbouring phases, stopping short of each node so the arrowhead is visible
    ph.forEach((p, i) => {
      const gap = (r + 14) / Math.max(rx, ry), t0 = ang(i) + gap, t1 = ang(i + 1) - gap, pts = [];
      for (let k = 0; k <= 24; k++) pts.push(P(t0 + (t1 - t0) * k / 24));
      const done = p.done && ph[(i + 1) % N].done;
      s += `<path d="${pts.map((q, k) => (k ? "L" : "M") + q[0].toFixed(1) + "," + q[1].toFixed(1)).join("")}" pathLength="1" class="a-draw" style="--d:${300 + i * 220};--dur:600ms" fill="none" stroke="${done ? "var(--ac)" : "var(--axis)"}" stroke-width="2.5" ${done ? "" : 'stroke-dasharray="6 6"'} stroke-linecap="round" marker-end="url(#loopArrow)"/>`;
    });
    s += `<circle class="loopdot" r="6" fill="var(--ac)"><animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#loopRing"/></animateMotion></circle>`;
    s += `<text x="${cx}" y="${cy - 8}" text-anchor="middle" style="font:700 ${clamp(w * .03, 22, 34)}px var(--display);fill:var(--ink)">CRISP-ML(Q)</text>
      <text class="m" x="${cx}" y="${cy + 16}" text-anchor="middle">six phases · iterate when drift appears</text>`;
    ph.forEach((p, i) => {
      const [x, y] = P(ang(i)), side = Math.abs(x - cx) < 4 ? 0 : x > cx ? 1 : -1, anchor = side ? (side > 0 ? "start" : "end") : "middle";
      const name = wrap(p.n, 18), desc = wrap(p.d, 26), lines = name.length + desc.length;
      const tx = x + side * (r + 14), ty = side ? y - (lines - 1) * 9 + 5 : y < cy ? y - r - 14 - (lines - 1) * 18 : y + r + 24;
      s += `<g class="a-pop" style="--d:${150 + i * 220}" ${tipAttr(`<div class="t">${p.done ? "Done in this project" : "Proposed next"}</div><b>${p.n}</b><br>${p.d}`)}>
          <circle cx="${x}" cy="${y}" r="${r}" fill="${p.done ? "var(--ac)" : "var(--surface)"}" stroke="${p.done ? "var(--ac)" : "var(--axis)"}" stroke-width="2.5" ${p.done ? "" : 'stroke-dasharray="5 4"'}/>
          <svg x="${x - 12}" y="${y - 12}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${p.done ? "#fff" : "var(--ink2)"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[p.ic]}</svg></g>`
        + name.map((ln, k) => `<text class="a-fade" style="--d:${250 + i * 220};font-weight:600;fill:var(--ink)" x="${tx}" y="${ty + k * 18}" text-anchor="${anchor}">${ln}</text>`).join("")
        + desc.map((ln, k) => `<text class="m a-fade" style="--d:${300 + i * 220}" x="${tx}" y="${ty + (name.length + k) * 18}" text-anchor="${anchor}">${ln}</text>`).join("");
    });
    return svg(w, h, "CRISP-ML(Q) cycle: four phases done in this project, deployment and monitoring proposed next", s);
  },
};

function mountCharts(root) {
  root.querySelectorAll("[data-chart]").forEach(el => {
    const w = Math.max(260, Math.floor(el.clientWidth)), h = Math.max(40, Math.floor(el.clientHeight));
    el.innerHTML = charts[el.dataset.chart](w, h, el.dataset.rows ? ROWS[el.dataset.rows]() : undefined);
  });
  root.querySelectorAll("[data-cross]").forEach(bindCross);
}
function bindCross(svgEl) {
  const hit = svgEl.querySelector(".hit"), xh = svgEl.querySelector(".xh"), L = +hit.dataset.l, R = +hit.dataset.r, xs = E.series.t, hero = svgEl.dataset.cross === "hero";
  const at = e => { const r = svgEl.getBoundingClientRect(), vx = (e.clientX - r.left) * (svgEl.viewBox.baseVal.width / r.width);
    const target = xs[0] + (vx - L) / (R - L) * (xs[xs.length - 1] - xs[0]); let i = 0, best = Infinity;
    xs.forEach((v, j) => { const d = Math.abs(v - target); if (d < best) { best = d; i = j; } }); return [i, L + (xs[i] - xs[0]) / (xs[xs.length - 1] - xs[0]) * (R - L)]; };
  hit.addEventListener("pointermove", e => { const [i, x] = at(e); xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
    showTip(hero
      ? `<div class="t">${tLabel(tAt(xs[i]))}</div>${dot("--ink")}Building <b>${fmt(E.series.building[i], 1)} kW</b><br>${dot("--ac")}A/C (sub-meter) <b>${fmt(E.series.ac[i], 1)} kW</b>`
      : `<div class="t">${tLabel(tAt(xs[i]))}</div>${dot("--ac")}Estimated <b>${fmt(E.series.ac_pred[i], 1)} kW</b><br>${dot("--ink")}Measured <b>${fmt(E.series.ac[i], 1)} kW</b><br><span style="opacity:.75">Building ${fmt(E.series.building[i], 1)} kW</span>`, e.clientX, e.clientY); });
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
}
function renderDash(flash) {

  k.innerHTML = dashKpis(); box.innerHTML = dashBody(); mountCharts(box);

function paintRail(i, prev) {
  const fwd = i > prev;
  rail.querySelectorAll(".st").forEach((b, j) => {
    // moving forward: each newly finished connector fills, then the next dot lights up after it
    const lag = fwd && j > prev && j <= i ? (j - prev - 1) * 220 + 380 : 0;
    b.style.setProperty("--dl", lag + "ms");
    b.classList.toggle("done", j < i);
    if (j === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });
  rail.querySelectorAll(".ln").forEach((l, j) => {
    l.style.setProperty("--ldl", fwd && j >= prev && j < i ? (j - prev) * 220 + "ms" : "0ms");
    l.classList.toggle("done", j < i); l.classList.toggle("next", j === i);
  });
}
function go(i, opts = {}) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (i === cur && !opts.force) return;
  const prev = cur < 0 ? i : cur; cur = i; const s = STEPS[i]; hideTip();
  main.innerHTML = `<section class="step pad${s.wide ? " wide" : ""}${s.team ? " team" : ""}${opts.still || prev === i ? "" : i > prev ? " fwd" : " back"}" aria-label="${esc(s.title)}">${s.render()}</section>`;
  const sec = main.firstElementChild;
  [...sec.querySelectorAll(".copy > *")].forEach((el, k) => el.style.setProperty("--k", k));
  [...sec.querySelectorAll(".panel, .kpi, .member")].forEach((el, k) => el.style.setProperty("--k", k));
  mountCharts(sec); renderDash(false);
  [...sec.querySelectorAll(".kpi")].forEach((el, k) => el.style.setProperty("--k", k));
  if (!opts.still) requestAnimationFrame(() => sec.classList.add("play"));
  main.scrollTop = 0;
  paintRail(i, opts.still ? i : prev);
  $("#counter").innerHTML = `<b>${i} / ${STEPS.length - 1}</b> · ${esc(s.title)}`;
  $("#prev").disabled = i === 0; $("#next").disabled = i === STEPS.length - 1;
  const hsh = i === DASH ? "#dashboard" : s.team ? "#team" : `#step-${i}`;
  if (location.hash !== hsh) history.replaceState(null, "", hsh);
  document.title = i ? `${s.title} · Who Sets the Peak?` : "Who Sets the Peak?";
}
rail.innerHTML = STEPS.map((s, i) => (i ? `<span class="ln" aria-hidden="true"><i></i></span>` : "") +

$("#themeBtn").addEventListener("click", toggleTheme);
const flipCard = c => { c.classList.toggle("flipped"); c.setAttribute("aria-pressed", String(c.classList.contains("flipped"))); };
main.addEventListener("keydown", e => { const c = e.target.closest(".member"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); flipCard(c); } });
main.addEventListener("click", e => {
  const card = e.target.closest(".member"); if (card && !e.target.closest("a")) { flipCard(card); return; }
  const b = e.target.closest("[data-trim],[data-hours]"); if (!b) return;
  if (b.dataset.trim) state.trim = +b.dataset.trim; else state.hours = b.dataset.hours;
  main.querySelectorAll("[data-trim]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.trim === state.trim)));
  main.querySelectorAll("[data-hours]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.hours === state.hours)));
  renderDash(true);
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (["ArrowRight", "PageDown"].includes(k) || (k === " " && !e.target.closest("button, [role=button]"))) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (k === "Home") go(0); else if (k === "End") go(STEPS.length - 1); else if (k === "d" || k === "D") go(DASH);
  else if (/^[0-9]$/.test(k)) go(+k);
  else if (k === "t" || k === "T") toggleTheme();
});
const fromHash = () => { const h = location.hash.slice(1); return h === "dashboard" ? DASH : h === "team" ? STEPS.length - 1 : /^step-\d+$/.test(h) ? +h.slice(5) : 0; };
addEventListener("hashchange", () => go(fromHash()));
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => go(cur, { force: true, still: true }), 150); });
go(fromHash(), { force: true });
})();
</script>
</body>
</html>
